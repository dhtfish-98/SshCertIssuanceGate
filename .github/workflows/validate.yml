name: Validate SSH user certificate gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client openssl
      - name: Bootstrap local build environment
        run: |
          mkdir -p Build/pip-cache
          python -m venv Build/bootstrap
          PIP_CACHE_DIR="$PWD/Build/pip-cache" Build/bootstrap/bin/python -m pip install build hatchling
      - name: Build and test from repository root
        run: Build/bootstrap/bin/python tools/validate_release.py
      - name: Check staged source stays clean
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
